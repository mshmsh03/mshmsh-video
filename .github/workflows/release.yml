# On every change to main, builds mshmsh-video.zip (the skill folder, ready to
# upload in the Claude app) and puts it on the release called "latest":
# https://github.com/mshmsh03/mshmsh-video/releases/download/latest/mshmsh-video.zip
name: Release zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mshmsh-video.zip
        run: |
          # The Claude app takes at most 200 files, so the zip is the app copy
          # (app-zip.sh says what it leaves out). Claude Code installs the full
          # skill from the repo with npx skills add.
          bash .github/app-zip.sh dist
          cd dist && zip -qr mshmsh-video.zip mshmsh-video
          # The same zip under the old name, so links shared before the rename
          # still give the current skill.
          cp mshmsh-video.zip video-xoshaka.zip
      - name: Put it on the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          cat > notes.md <<NOTES
          The whole skill in one zip, rebuilt on every change to main (this one: ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)).

          - **Claude app:** download mshmsh-video.zip and upload it in your skill settings. To update, upload the new zip in place of the old one. The app takes at most 200 files, so this zip leaves out the test cases and the HyperFrames scripts, sounds and fonts, which only run in Claude Code on a PC.
          - **Claude Code:** \`npx skills add mshmsh03/mshmsh-video\`. To update, run the same command again.

          The skill was called video-xoshaka until 2026-11-19. If you have that copy, remove it after installing this one (in the Claude app, delete video-xoshaka; in Claude Code, \`npx skills remove video-xoshaka -g\`). video-xoshaka.zip here is the same zip, kept for links shared before the rename.

          What changed: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          NOTES
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/mshmsh-video.zip dist/video-xoshaka.zip --clobber
            gh release edit latest --title "mshmsh-video" --notes-file notes.md
          else
            gh release create latest dist/mshmsh-video.zip dist/video-xoshaka.zip --title "mshmsh-video" --notes-file notes.md
          fi
